[package]
name = "shellmux"
version = "0.1.0"
description = "Source-available SSH client & terminal"
authors = ["Shellmux contributors"]
license-file = "../LICENSE"
edition = "2021"
rust-version = "1.82"

[lib]
name = "shellmux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
# Backend `ring` thay cho `aws-lc-rs` mặc định: aws-lc-sys cần cmake, thêm một
# dependency hệ thống cho mọi người build từ source.
russh = { version = "0.62", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "2.3"
# Already in the dependency tree transitively via russh's own agent module;
# listed directly so `agent.rs` can build the one-shot connection stream
# `russh::keys::agent::server::serve` expects.
futures = "0.3"
# For encrypted vault export/import. `argon2` is already transitively pulled
# in by `ssh-key`'s own passphrase handling — pinned to the same version so
# cargo unifies instead of building two copies.
chacha20poly1305 = "0.10"
argon2 = "=0.6.0-rc.8"
rand = "0.10"
portable-pty = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4"
dashmap = "6"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
thiserror = "2"
async-trait = "0.1"
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# NSVisualEffectView thật cho vibrancy. Chỉ macOS: crate không hỗ trợ Linux,
# và Windows (acrylic/mica) chưa được kiểm trên máy build hiện tại — để Phase 2.
window-vibrancy = "0.8"

[dev-dependencies]
tempfile = "3"
# Cargo unions features across [dependencies] and [dev-dependencies] for the
# same crate, so this only enables `test` for test builds — the shipped app
# never links `tauri::test`'s mock runtime.
tauri = { version = "2.11", features = ["test"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
